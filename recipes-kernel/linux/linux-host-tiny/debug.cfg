# Debugging symbols (0 bytes RAM usage, increases offline vmlinux size for GDB)
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_NONE=n

# Memory Inspection (VirtIO Balloon and internal kernel telemetry)
CONFIG_VIRTIO_BALLOON=y
CONFIG_VM_EVENT_COUNTERS=y
CONFIG_COMPACTION=y
CONFIG_BALLOON_COMPACTION=y
CONFIG_SLABINFO=y
