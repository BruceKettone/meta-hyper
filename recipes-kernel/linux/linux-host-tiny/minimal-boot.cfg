# Serial and TTY console for ARM64
CONFIG_TTY=y
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y


# Virtual storage and PCI bus
CONFIG_PCI=y
CONFIG_PCI_HOST_GENERIC=y

# Core Block Layer (Required for ext4 and virtio-blk)
CONFIG_BLOCK=y
CONFIG_BLK_DEV=y

# VirtIO Storage (Manually selected to avoid virtio.scc dependency bloat)
CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_BLK=y

# Core Kernel output and Device Tree support (Required for QEMU 'virt' ARM64)
CONFIG_PRINTK=y
CONFIG_OF=y
CONFIG_OF_EARLY_FLATTREE=y
CONFIG_ARM_AMBA=y

# Pseudo-filesystems
CONFIG_SYSFS=y
CONFIG_PROC_FS=y
CONFIG_TMPFS=y
CONFIG_SYSCTL=y
CONFIG_PROC_SYSCTL=y

# Filesystems (Migrated from Yocto kernel features)
CONFIG_EXT4_FS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
