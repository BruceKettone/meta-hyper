# --- VirtIO Basics ---
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_BLK=y
CONFIG_NET=y
CONFIG_VIRTIO_NET=y
CONFIG_HW_RANDOM_VIRTIO=y
CONFIG_VIRTIO_CONSOLE=y
CONFIG_HVC_DRIVER=y

# --- Guest OS Base (Required by X11) ---
CONFIG_EPOLL=y
CONFIG_UNIX=y
CONFIG_UNIX_DIAG=y
CONFIG_TTY=y
CONFIG_UNIX98_PTYS=y
CONFIG_MULTIUSER=y
CONFIG_SHMEM=y
CONFIG_KALLSYMS=n

# --- Graphics (BOCHS) ---
CONFIG_DRM=y
CONFIG_DRM_BOCHS=y
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y

# --- Audio Support ---
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_PCI=y
CONFIG_SND_HDA_INTEL=y
CONFIG_SND_HDA_GENERIC=y
CONFIG_SND_PCM=y
CONFIG_SND_TIMER=y
CONFIG_SND_PCM_TIMER=y

# --- Virtual Terminal ---
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_VT_HW_CONSOLE_BINDING=y

# --- Input & USB (Passed-through Devices) ---
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_INPUT_MOUSE=y
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_PCI=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_PCI=y
CONFIG_USB_HID=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_PCI_MSI=y
CONFIG_INOTIFY_USER=y
