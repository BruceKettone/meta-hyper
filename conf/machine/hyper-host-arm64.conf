# Barebones ARM64 Host Machine for Micro-Hypervisor
#@TYPE: Machine
#@NAME: hyper-host-arm64
#@DESCRIPTION: Ultra-minimal ARM64 host machine definition

require conf/machine/include/arm/arch-arm64.inc

# Disable all default Yocto BSP hardware features and package recommendations
MACHINE_FEATURES = ""
KERNEL_FEATURES = ""
MACHINE_EXTRA_RRECOMMENDS = ""

# Kernel binary image format for ARM64
KERNEL_IMAGETYPE = "Image"

# Serial console definition for PL011 UART
SERIAL_CONSOLES = "115200;ttyAMA0"
USE_VT = "0"

# Target rootfs format
IMAGE_FSTYPES = "erofs"
EXTRA_IMAGECMD:erofs = "-x -1"
IMAGE_FEATURES += "read-only-rootfs"

# Preferred kernel provider for this machine
PREFERRED_PROVIDER_virtual/kernel = "linux-host-tiny"
