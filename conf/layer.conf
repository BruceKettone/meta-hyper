# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-hyper"
BBFILE_PATTERN_meta-hyper = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-hyper = "6"

LAYERDEPENDS_meta-hyper = "core"
LAYERSERIES_COMPAT_meta-hyper = "wrynose"
