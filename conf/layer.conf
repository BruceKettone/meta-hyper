BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-hyper"
BBFILE_PATTERN_meta-hyper = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-hyper = "6"

LAYERDEPENDS_meta-hyper = "core"
LAYERSERIES_COMPAT_meta-hyper = "wrynose"
