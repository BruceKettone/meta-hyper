# Guest configuration
MACHINE = "lkvm-arm64"
DISTRO = "poky"
TMPDIR .= "-${BB_CURRENT_MC}"

# Standard C Library instead of musl
TCLIBC = "glibc"
DISTRO_FEATURES:append = " x11 alsa"
LICENSE_FLAGS_ACCEPTED += "commercial"

# Pin guest kernel (prevents BitBake from auto-selecting the higher-versioned 7.2 host kernel)
PREFERRED_PROVIDER_virtual/kernel:lkvm-arm64 = "linux-yocto-tiny"
