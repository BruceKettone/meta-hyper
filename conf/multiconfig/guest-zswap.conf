MACHINE = "lkvm-arm64"
DISTRO = "poky"
TMPDIR .= "-guest-zswap"

TCLIBC = "glibc"
DISTRO_FEATURES:append = " x11 alsa"
LICENSE_FLAGS_ACCEPTED += "commercial"

# Reuse the existing 7.2 host kernel recipe as the guest's kernel provider
PREFERRED_PROVIDER_virtual/kernel:lkvm-arm64 = "linux-host-tiny"
PREFERRED_VERSION_linux-host-tiny:lkvm-arm64 = "7.2%"
PREFERRED_VERSION_virtual/kernel:lkvm-arm64 = "7.2%"
HOST_SWAP_FEATURE = "zswap.scc"
KERNEL_FEATURES:append = " cfg/fs/ext4.scc"
